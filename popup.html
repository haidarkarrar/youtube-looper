<!DOCTYPE html>
<html>
  <head>
    <title>Looper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>Loopy</h1>
    <label>Start Time</label>
    <div class="time-picker" id="startTime">
      <input type="number" placeholder="Hours" min="0" disabled>
      <input type="number" placeholder="Minutes" min="0" max="59" disabled>
      <input type="number" placeholder="Seconds" min="0" max="59" disabled>
    </div>
    <label>End Time</label>
    <div class="time-picker" id="endTime">
      <input type="number" placeholder="Hours" min="0" disabled>
      <input type="number" placeholder="Minutes" min="0" max="59" disabled>
      <input type="number" placeholder="Seconds" min="0" max="59" disabled>
    </div>
    <p id="maxTimeHint"></p>
    <button id="setLoop" disabled>Set Loop</button>
    <button id="stopLoop" disabled>Stop Loop</button>
    <p id="error"></p>
    <p id="currentLoop"></p>
    <script src="popup.js"></script>
  </body>
</html>
